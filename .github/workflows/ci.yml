name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ZIG_VERSION: 0.16.0

jobs:
  # The whole suite on the hosts where it runs to the end. A pseudo-terminal is
  # a kernel object and a process group is a kernel concept, so a
  # cross-compilation check proves nothing about either: this job is where the
  # behaviour is tested. Windows has a job of its own below.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A suite that hangs reports nothing and sits until the run is killed by
    # hand. Every job here finishes in a couple of minutes; this is the bound
    # that turns a hang into a failure.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Formatting
        run: zig fmt --check src examples build.zig

      # All four modes: every test here starts a real child process, and what
      # runs between `fork` and `execve` is the kind of code a different
      # inlining decision can change.
      - name: Test — Debug
        run: zig build test -Doptimize=Debug --test-timeout 45s

      - name: Test — ReleaseSafe
        run: zig build test -Doptimize=ReleaseSafe --test-timeout 45s

      - name: Test — ReleaseFast
        run: zig build test -Doptimize=ReleaseFast --test-timeout 45s

      - name: Test — ReleaseSmall
        run: zig build test -Doptimize=ReleaseSmall --test-timeout 45s

      # The same suite with the `posix_spawn` path turned off. It is a second
      # implementation of one contract, and this is what says the two produce
      # the same child.
      - name: Test — the fork path
        run: zig build test -Doptimize=ReleaseSafe -Dfork-spawn --test-timeout 45s

      # Built AND run. An example that only compiles proves the names resolve;
      # running it is what proves the library works.
      - name: Examples
        run: zig build examples

  # Windows, in pieces.
  #
  # The Debug suite there has hung twice, and a step that runs out of its
  # `timeout-minutes` has its log discarded — so nothing a hung run prints can
  # be read afterwards. Two things answer that between them.
  #
  # `--test-timeout`, above and here, is the build runner's own bound on one
  # test: it ends the test binary and names the test that did not finish, so a
  # hang inside a test body fails the step with a message instead of running
  # out the clock. It cannot see a hang that is not inside a test. (`CONDUIT_TRACE`
  # in the environment of a step is the other half, when one is needed; it is
  # off here because the job is green and a clean log is worth more.)
  #
  # For that, Debug is split: the examples on their own, then the suite one
  # file at a time and `src/spawn_test.zig` in seven groups, each step named
  # after what it runs and bounded at four minutes. `-Dtest-filter` matches a
  # substring of a test's fully qualified name, which begins with the file it
  # is in. Every filter changes the build hash, so each step compiles the test
  # binary again; that is the cost of the bisection and the reason this job is
  # allowed longer than the others.
  test-windows:
    name: test (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Formatting
        run: zig fmt --check src examples build.zig

      - name: Debug — examples
        timeout-minutes: 4
        run: zig build examples -Doptimize=Debug --summary all

      - name: Debug — Pty
        timeout-minutes: 4
        run: zig build unit -Doptimize=Debug "-Dtest-filter=Pty.test" --test-timeout 45s --summary all

      - name: Debug — Child, Reaper, tty, environ, shell
        timeout-minutes: 4
        run: >
          zig build unit -Doptimize=Debug --test-timeout 45s --summary all
          "-Dtest-filter=Child.test" "-Dtest-filter=child_windows.test"
          "-Dtest-filter=Reaper.test" "-Dtest-filter=tty.test"
          "-Dtest-filter=environ.test" "-Dtest-filter=shell.test"

      - name: Debug — Expect
        timeout-minutes: 4
        run: zig build unit -Doptimize=Debug "-Dtest-filter=Expect.test" --test-timeout 45s --summary all

      - name: Debug — spawn, pipes and collecting
        timeout-minutes: 4
        run: >
          zig build unit -Doptimize=Debug --test-timeout 45s --summary all
          "-Dtest-filter=a child on pipes" "-Dtest-filter=max_bytes"
          "-Dtest-filter=gives up on a child" "-Dtest-filter=tryWait is null"
          "-Dtest-filter=Reaper.exit"

      - name: Debug — spawn, streams and half-close
        timeout-minutes: 4
        run: >
          zig build unit -Doptimize=Debug --test-timeout 45s --summary all
          "-Dtest-filter=stdinWriter" "-Dtest-filter=closeStdin is"
          "-Dtest-filter=waitTimeout gives up" "-Dtest-filter=signalName say how"

      - name: Debug — spawn, killing and process groups
        timeout-minutes: 4
        run: >
          zig build unit -Doptimize=Debug --test-timeout 45s --summary all
          "-Dtest-filter=killWait ends" "-Dtest-filter=process group of its own"
          "-Dtest-filter=process group is the one" "-Dtest-filter=shares the parent"
          "-Dtest-filter=killWait with no grace"
          "-Dtest-filter=reaches what the child started"
          "-Dtest-filter=waitTree says"

      # Traced: both tests here that put a child on a pseudoconsole have hung
      # on a runner at one time or another, so this step says which stage it
      # reached.
      - name: Debug — spawn, pseudo-terminals
        timeout-minutes: 4
        run: >
          zig build unit -Doptimize=Debug --test-timeout 45s --summary all
          "-Dtest-filter=writes to its terminal reaches" "-Dtest-filter=on a pty"
          "-Dtest-filter=Ctrl-C" "-Dtest-filter=foreground process group"
          "-Dtest-filter=hangs the terminal up"

      - name: Debug — spawn, per-stream stdio
        timeout-minutes: 4
        run: >
          zig build unit -Doptimize=Debug --test-timeout 45s --summary all
          "-Dtest-filter=stderr_to sends" "-Dtest-filter=each stream is chosen"
          "-Dtest-filter=terminal end of a pair" "-Dtest-filter=a stream can be closed"
          "-Dtest-filter=older stdio shapes"

      - name: Debug — spawn, credentials and limits
        timeout-minutes: 4
        run: >
          zig build unit -Doptimize=Debug --test-timeout 45s --summary all
          "-Dtest-filter=file-creation mask" "-Dtest-filter=uid and gid"
          "-Dtest-filter=resource limit set at spawn"
          "-Dtest-filter=resource limits are refused"
          "-Dtest-filter=credentials are refused"
          "-Dtest-filter=a job limit bounds"
          "-Dtest-filter=job limits are refused"
          "-Dtest-filter=as inheritable after a spawn"

      # Traced: `spawnShell starts the user's shell on a pair` hung here once
      # with nothing to say, so this step says which stage it reached.
      - name: Debug — spawn, environment, failure and the shell
        timeout-minutes: 4
        run: >
          zig build unit -Doptimize=Debug --test-timeout 45s --summary all
          "-Dtest-filter=environment and working directory"
          "-Dtest-filter=scrubbed environment" "-Dtest-filter=path_search"
          "-Dtest-filter=is not there" "-Dtest-filter=batch file"
          "-Dtest-filter=spawnShell starts"

      # Whole again, once Debug has said where it stands.
      - name: Test — ReleaseSafe
        timeout-minutes: 8
        run: zig build test -Doptimize=ReleaseSafe --test-timeout 45s

      - name: Test — ReleaseFast
        timeout-minutes: 8
        run: zig build test -Doptimize=ReleaseFast --test-timeout 45s

      - name: Test — ReleaseSmall
        timeout-minutes: 8
        run: zig build test -Doptimize=ReleaseSmall --test-timeout 45s

  # The same suite on musl, which is not what ubuntu-latest gives. `ptsname_r`
  # reports failure differently on glibc and on musl, and this package reads
  # `errno` on both rather than trusting the return value -- a claim worth a
  # container to hold honest. ci/linux.sh is the same script a developer runs
  # from a Mac.
  linux-musl:
    name: test (alpine, musl)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: ci/linux.sh --musl

  # README.md's Usage block is a region of examples/usage.zig, which the test
  # job builds and runs. This is what keeps the snippet a reader copies the
  # same text as the code CI executes.
  docs:
    name: documented usage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: ci/readme_usage.sh --check

  # Compile-only coverage of the targets the suite cannot execute on. These
  # prove the sources are portable across the systems the package claims; the
  # `test` job above is what proves behaviour.
  cross-compile:
    name: cross (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-gnu
          - aarch64-linux-gnu
          - x86_64-linux-musl
          - x86_64-macos
          - aarch64-macos
          - x86_64-windows-gnu
          - x86_64-windows-msvc
          - aarch64-windows-gnu
          - x86_64-freebsd
          - x86_64-netbsd
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build -Dtarget=${{ matrix.target }}
