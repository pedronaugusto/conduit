name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ZIG_VERSION: 0.16.0

jobs:
  # The suite on every host it supports. Windows gets its own job below, for
  # the little there is to check there.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Formatting
        run: zig fmt --check src examples build.zig

      # All four modes: every test here starts a real child process, and what
      # runs between `fork` and `execve` is the kind of code a different
      # inlining decision can change.
      - name: Test — Debug
        run: zig build test -Doptimize=Debug

      - name: Test — ReleaseSafe
        run: zig build test -Doptimize=ReleaseSafe

      - name: Test — ReleaseFast
        run: zig build test -Doptimize=ReleaseFast

      - name: Test — ReleaseSmall
        run: zig build test -Doptimize=ReleaseSmall

      # Built AND run. An example that only compiles proves the names resolve;
      # running it is what proves the library works.
      - name: Examples
        run: zig build examples

      # README.md's Usage block is a region of examples/usage.zig. This is what
      # keeps the snippet a reader copies the same thing CI executes.
      - name: README Usage block matches the example
        run: ci/readme_usage.sh --check

  # Windows has no pseudo-terminal device and no fork, so src/zpty.zig is a
  # deliberate compile error there -- see "The Windows seam" in its module doc
  # comment -- and there is no library, no test and no example on that runner
  # to build, not even partially. What can still be checked on a Windows host
  # is everything that is not the library: that the sources stay formatted with
  # the line endings .gitattributes pins, and that build.zig, which `zig build`
  # compiles and runs before it compiles any module, stays portable. The rest
  # is skipped for the reason above, and will stop being skipped when there is
  # a ConPTY implementation behind the same API.
  windows:
    name: windows (what compiles)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Formatting
        run: zig fmt --check src examples build.zig
      - name: build.zig compiles and its graph resolves
        run: zig build --help

  # Compile-only coverage of the targets the suite cannot execute on. These
  # prove the sources are portable across the systems the package claims; the
  # `test` job above is what proves behaviour.
  cross-compile:
    name: cross (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-gnu
          - aarch64-linux-gnu
          - x86_64-linux-musl
          - x86_64-macos
          - aarch64-macos
          - x86_64-freebsd
          - x86_64-netbsd
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build -Dtarget=${{ matrix.target }}
