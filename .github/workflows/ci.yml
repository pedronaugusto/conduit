name: CI
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: Run the full merge gate
        type: boolean
        default: false
      adopt:
        description: Initialize absent source ledgers from findings already on main
        type: boolean
        default: false
  pull_request:
  merge_group:
concurrency:
  # Main status runs must not share the replaceable branch queue.
  group: ci-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('main-status-{0}', github.run_id) || github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
  actions: read
jobs:
  skip:
    if: github.event_name != 'push'
    uses: pedronaugusto/preflight/.github/workflows/skip.yml@9e72aac1b9f2837716105dca4de617685a4ca284
    with:
      full: ${{ github.event_name != 'workflow_dispatch' || inputs.full }}
      preflight-ref: 9e72aac1b9f2837716105dca4de617685a4ca284
  gate:
    needs: skip
    if: always() && (github.event_name == 'push' || (needs.skip.result == 'success' && needs.skip.outputs.docs-only != 'true'))
    uses: pedronaugusto/preflight/.github/workflows/zig.yml@9e72aac1b9f2837716105dca4de617685a4ca284
    with:
      preflight-ref: 9e72aac1b9f2837716105dca4de617685a4ca284
      full: ${{ github.event_name != 'workflow_dispatch' || inputs.full }}
      adopt: ${{ github.event_name == 'workflow_dispatch' && inputs.adopt }}
      attest: ${{ github.event_name == 'push' }}
      # Generated from ci/workflow.json with zig build plan -- --full false.
      fast-matrix: >-
        {"include":[{"os":"ubuntu-latest","name":"Linux Debug","step":"preflight-fast","args":"-Doptimize=Debug","shard":"","timeout":"--test-timeout 45s","setup":true,"job_timeout":20,"cache_key":"fast-linux-debug-0","artifact":""}]}
      # Generated from ci/workflow.json with zig build plan -- --full true.
      full-matrix: >-
        {"include":[{"os":"ubuntu-latest","name":"test (ubuntu-latest, Debug)","step":"ci","args":"-Doptimize=Debug -Dci-lint=false -Dci-timings=true","shard":"","timeout":"--test-timeout 45s","setup":true,"job_timeout":20,"cache_key":"01947137a0b1f3b1","artifact":""},{"os":"ubuntu-latest","name":"test (ubuntu-latest, ReleaseSafe)","step":"ci","args":"-Doptimize=ReleaseSafe -Dci-lint=false -Dci-timings=true","shard":"","timeout":"--test-timeout 45s","setup":true,"job_timeout":20,"cache_key":"3667898e0a45f0ee","artifact":""},{"os":"ubuntu-latest","name":"test (ubuntu-latest, ReleaseFast)","step":"ci","args":"-Doptimize=ReleaseFast -Dci-lint=false -Dci-timings=true","shard":"","timeout":"--test-timeout 45s","setup":true,"job_timeout":20,"cache_key":"9adf5e897789bf7d","artifact":""},{"os":"macos-latest","name":"test (macos-latest, Debug)","step":"ci","args":"-Doptimize=Debug -Dci-lint=false -Dci-timings=true","shard":"","timeout":"--test-timeout 45s","setup":true,"job_timeout":20,"cache_key":"64985ed68efee111","artifact":""},{"os":"macos-latest","name":"test (macos-latest, ReleaseSafe)","step":"ci","args":"-Doptimize=ReleaseSafe -Dci-lint=false -Dci-timings=true","shard":"","timeout":"--test-timeout 45s","setup":true,"job_timeout":20,"cache_key":"9af08c0e418a8881","artifact":""},{"os":"windows-latest","name":"test (windows-latest, Debug)","step":"ci","args":"-Doptimize=Debug -Dci-lint=false -Dci-timings=true","shard":"","timeout":"--test-timeout 45s","setup":true,"job_timeout":20,"cache_key":"3fbe91f81225ba5c","artifact":""},{"os":"windows-latest","name":"test (windows-latest, ReleaseSafe)","step":"ci","args":"-Doptimize=ReleaseSafe -Dci-lint=false -Dci-timings=true","shard":"","timeout":"--test-timeout 45s","setup":true,"job_timeout":20,"cache_key":"3e842c9ab2333759","artifact":""},{"os":"ubuntu-latest","name":"source checks and documented snippets","step":"lint","args":"","shard":"","timeout":"","setup":false,"job_timeout":20,"cache_key":"119e3d2ddf82d539","artifact":""},{"os":"ubuntu-latest","name":"compile (ReleaseSmall)","step":"check","args":"-Doptimize=ReleaseSmall","shard":"","timeout":"","setup":false,"job_timeout":20,"cache_key":"4515d8efc7af7d51","artifact":""},{"os":"ubuntu-latest","name":"cross (all configured targets)","step":"preflight-cross","args":"","shard":"","timeout":"","setup":false,"job_timeout":20,"cache_key":"1b13795de3f7fdd5","artifact":""},{"os":"ubuntu-latest","name":"ThreadSanitizer (Linux)","step":"unit","args":"-Dthread-sanitizer -Doptimize=Debug -Dci-lint=false","shard":"","timeout":"--test-timeout 120s","setup":true,"job_timeout":20,"cache_key":"4a863b4dbe2a0998","artifact":""}]}
  fork:
    needs: skip
    if: needs.skip.outputs.docs-only != 'true' && github.event_name != 'push' && (github.event_name != 'workflow_dispatch' || inputs.full)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pedronaugusto/preflight
          ref: 9e72aac1b9f2837716105dca4de617685a4ca284
          path: .preflight
      - uses: ./.preflight/.github/actions/setup
      - run: zig build ci -Dci-lint=false -Doptimize=ReleaseSafe -Dfork-spawn --test-timeout 45s
  linux-musl:
    needs: skip
    if: needs.skip.outputs.docs-only != 'true' && github.event_name != 'push' && (github.event_name != 'workflow_dispatch' || inputs.full)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        optimize: [Debug, ReleaseSafe]
        cgroup: [false]
        include:
          - optimize: Debug
            cgroup: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pedronaugusto/preflight
          ref: 9e72aac1b9f2837716105dca4de617685a4ca284
          path: .preflight
      - uses: ./.preflight/.github/actions/setup
      - run: zig build ci-linux -- --musl --no-lint --optimize ${{ matrix.optimize }} --cgroup ${{ matrix.cgroup }}
